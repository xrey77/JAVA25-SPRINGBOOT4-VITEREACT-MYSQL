spring.application.name=java25.springboot4.mysql

debug=true

server.port=9000
spring.mvc.static-path-pattern=/**

logging.level.root=INFO
logging.level.org.springframework.boot.autoconfigure=INFO

#lombok
# lombok.addLombokGeneratedAnnotation = true
# lombok.extern.findbugs.addSuppressFBWarnings = true

# MySql connection properties
spring.datasource.url=jdbc:mysql://localhost:3306/java25.springboot4?createDatabaseIfNotExist=true
spring.datasource.username=rey
spring.datasource.password=rey
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL (Data Definition Language) settings
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.hibernate.ddl-auto=create
# Optional: show the generated SQL in the console
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform

# File upload Definition
file.upload-dir=./public
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

